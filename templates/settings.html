<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <title>Settings</title>
   <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
   <div class="container">
      <h2>Setting Sensor limits</h2>
      <table>
         <thead>
            <tr>
               <th>Sensor</th>
               <th>Current min</th>
               <th>Current max</th>
               <th>New min input</th>
               <th>New max input</th>
            </tr>
         </thead>
         <tbody id="settings-table-body"></tbody>
      </table>

      <div class="actions">
         <button onclick="window.location.href='/'" class="btn secondary">Back</button>
         <button onclick="saveAllSettings()" class="btn primary">Save</button>
      </div>
   </div>

   <script src="/scripts/script.js"></script>
</body>
</html>
